name: IPAApp
options:
  bundleIdPrefix: com.dts
  deploymentTarget:
    iOS: 13.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.dts.freefireth
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  IPAApp:
    type: application
    platform: iOS
    sources:
      - IPAApp
      - exploit
      - kexploit
    settings:
      base:
        INFOPLIST_FILE: IPAApp/Info.plist
        SWIFT_VERSION: 5.0
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) COCOAPODS=1"
    dependencies:
      - framework: libsqlite3.tbd
      - framework: UIKit.framework
      - framework: Foundation.framework
