name: IPAApp
options:
  bundleIdPrefix: com.dth
  createIntermediateGroups: true
targets:
  IPAApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: IPAApp
      - path: exploit
      - path: kexploit
    info:
      path: IPAApp/Info.plist
    settings:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      SWIFT_OBJC_BRIDGING_HEADER: IPAApp/IPAApp-Bridging-Header.h
      ENABLE_BITCODE: NO
      SWIFT_VERSION: 5.0
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
