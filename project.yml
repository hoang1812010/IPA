name: IPAApp
options:
  bundleIdPrefix: com.apple
  deploymentTarget:
    iOS: 14.0

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
    PRODUCT_NAME: MobileHouseArrest
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  IPAApp:
    type: application
    platform: iOS
    sources:
      - path: IPAApp
      - path: exploit
      - path: kexploit
    
    settings:
      base:
        INFOPLIST_FILE: IPAApp/Info.plist
        SWIFT_VERSION: 5.0
        SWIFT_OBJC_BRIDGING_HEADER: IPAApp/IPAApp-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: IPAApp/IPAApp.entitlements
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    
    dependencies:
      - framework: libsqlite3.tbd
        embed: false
      - framework: UIKit.framework
        embed: false
      - framework: Foundation.framework
        embed: false
