- name: Build Unsigned App
        run: |
          xcodebuild -project IPAApp.xcodeproj \
            -scheme IPAApp \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Package into IPA
        run: |
          # Tạo thư mục Payload chuẩn cấu trúc của iOS
          mkdir -p Payload
          
          # Đưa file .app vừa build vào Payload
          mv build/Build/Products/Release-iphoneos/IPAApp.app Payload/
          
          # Nén lại thành file .ipa
          zip -qr IPAApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAApp-Unsigned
          path: IPAApp.ipa
