name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
    - name: List available Xcode versions
      run: ls /Applications/ | grep Xcode
      
    - name: Build IPAApp
      run: |
        cd IPAApp
        xcodebuild -project IPAApp.xcodeproj \
          -scheme IPAApp \
          -configuration Release \
          -archivePath $GITHUB_WORKSPACE/build/IPAApp.xcarchive \
          clean archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          VALID_ARCHS="arm64 armv7"
          
    - name: Export IPA
      run: |
        mkdir -p export_options
        cat > export_options/export.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfiles</key>
            <dict/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath $GITHUB_WORKSPACE/build/IPAApp.xcarchive \
          -exportPath $GITHUB_WORKSPACE/build \
          -exportOptionsPlist export_options/export.plist \
          -allowProvisioningUpdates || true
          
    - name: Try alternative IPA creation
      if: failure()
      run: |
        mkdir -p $GITHUB_WORKSPACE/build/Payload
        cp -R $GITHUB_WORKSPACE/build/IPAApp.xcarchive/Products/Applications/IPAApp.app $GITHUB_WORKSPACE/build/Payload/
        cd $GITHUB_WORKSPACE/build
        zip -r IPAApp.ipa Payload
        rm -rf Payload
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPAApp
        path: build/*.ipa
        retention-days: 30
        
    - name: Create Release (Optional)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
