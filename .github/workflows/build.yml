name: Build IPA Unsigned

on:
  push:
    branches: [ "main" ] # Sẽ tự động chạy khi có code mới push lên nhánh main
  workflow_dispatch:     # Cho phép bạn bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    runs-on: macos-latest # Sử dụng máy ảo MacOS của GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt XcodeGen (Đã thêm cấu hình chống treo Homebrew)
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          NONINTERACTIVE: 1
        run: brew install xcodegen -v

      # 2. Tạo file IPAApp.xcodeproj từ project.yml
      - name: Generate Xcode Project
        run: xcodegen generate

      # 3. Biên dịch mã nguồn (Build Unsigned App)
      - name: Build Unsigned App
        run: |
          xcodebuild -project IPAApp.xcodeproj \
            -scheme IPAApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      # 4. Đóng gói thành file .ipa
      - name: Package into IPA
        run: |
          # Tạo thư mục Payload chuẩn cấu trúc của iOS
          mkdir -p Payload
          
          # Đưa file .app vừa build vào Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          
          # Nén lại thành file .ipa
          zip -qr IPAApp.ipa Payload

      # 5. Tải file .ipa lên mục Artifacts của GitHub Actions
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAApp-Unsigned
          path: IPAApp.ipa
