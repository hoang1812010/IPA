name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build unsigned .app
      run: |
        xcodebuild -project IPAApp.xcodeproj \
                   -scheme IPAApp \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   -derivedDataPath build

    - name: Package .ipa
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/IPAApp.app Payload/
        zip -r IPAApp-Unsigned.ipa Payload/

    - name: Upload unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: IPAApp-Unsigned
        path: IPAApp-Unsigned.ipa
